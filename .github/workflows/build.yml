name: Build APK

on:
  push:
    branches: [main, qa-smoke]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      smoke:
        description: Run the emulator smoke test and capture screenshots
        type: boolean
        default: false
      qa:
        description: QA run with animations on, gesture navigation and screen recordings
        type: boolean
        default: false
      profile:
        description: Generate the baseline profile on an emulator and upload it as an artifact
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags are needed to derive the version name

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Set version name
        run: |
          # Keep the version name numeric; build identifiers stay in versionCode only.
          echo "VERSION_CODE=$((30000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION=${GITHUB_REF_NAME#v}
            echo "UPDATE_RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            if [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              VERSION_NAME=$TAG_VERSION
            else
              VERSION_NAME=0.0.5
            fi
          else
            VERSION_NAME=0.0.5
            echo "UPDATE_RELEASE_TAG=build-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle testDebugUnitTest assembleRelease bundleRelease --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Vanim-${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/Vanim-${VERSION_NAME}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: Vanim-${{ env.VERSION_NAME }}
          path: dist/*

      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          # Tag pushes keep their own tag; pushes to main get an automatic build-N tag.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Vanim ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          make_latest: true

  smoke:
    needs: build
    if: (github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.qa)) || (github.event_name == 'push' && github.ref == 'refs/heads/qa-smoke')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: apk
          merge-multiple: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: ${{ !inputs.qa }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: .github/scripts/${{ inputs.qa && 'qa' || 'smoke' }}.sh "$(ls apk/*.apk | head -1)" screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: screenshots/

  profile:
    if: github.event_name == 'workflow_dispatch' && inputs.profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle :app:generateBaselineProfile --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: app/src/release/generated/baselineProfiles/
